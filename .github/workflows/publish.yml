name: Publish to npm

# 使用 npm 的 Trusted Publishing（OIDC）发布：不需要任何长期令牌，
# 也就绕开了 npm 正在收紧的「2FA-bypass token」限制。
#
# 首次使用前需要在 npmjs.com 上配置：
#   包的 Settings → Trusted publishing → Add trusted publisher → GitHub Actions
#     Organization or user: Zoin-Hub
#     Repository:           selfloom
#     Workflow filename:    publish.yml
#     Environment name:     （留空）
#   并勾选允许「直接 npm publish」（默认只允许 stage publish，那样还需要人工批准）

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Trusted Publishing 必需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing 要求 npm CLI >= 11.5.1，而 Node 自带的 npm 版本可能偏低
      # （例如 Node 22 自带 npm 10.x）。显式升级，避免第一次发 Release 就失败。
      - name: 升级 npm（Trusted Publishing 要求 >= 11.5.1）
        run: npm install -g npm@latest && npm --version

      # 发布前自检：先把包打出来、解开、再跑一遍。
      # 目的：拦住「本地能跑、别人 npx 一装就崩」——files 少写一个目录就会这样。
      - name: 发布前自检（解包后运行 demo）
        run: |
          set -euo pipefail
          npm pack
          mkdir -p /tmp/verify
          tar -xzf selfloom-*.tgz -C /tmp/verify
          node /tmp/verify/package/bin/selfloom.mjs demo --out /tmp/demo-out
          node /tmp/verify/package/bin/selfloom.mjs help > /dev/null
          test -f /tmp/demo-out/timeline.md
          echo "自检通过：包内容完整、demo 可运行"

      - name: 发布
        run: npm publish --provenance
