name: Publish to npm

# 使用 npm 的 Trusted Publishing（OIDC）发布：不需要任何长期令牌，
# 也就绕开了 npm 正在收紧的「2FA-bypass token」限制。
#
# 首次发布前需要在 npmjs.com 上：
#   包的 Settings → Trusted Publisher → 添加 GitHub Actions
#     Organization/user: Zoin-Hub
#     Repository:        selfloom
#     Workflow filename: publish.yml
#     Environment:       （留空）

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Trusted Publishing 必需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # 发布前自检：先把包打出来、解开、再跑一遍。
      # 目的：拦住「本地能跑、别人 npx 一装就崩」——files 少写一个目录就会这样。
      - name: 发布前自检（解包后运行 demo）
        run: |
          set -euo pipefail
          npm pack
          mkdir -p /tmp/verify
          tar -xzf selfloom-*.tgz -C /tmp/verify
          node /tmp/verify/package/bin/selfloom.mjs demo --out /tmp/demo-out
          node /tmp/verify/package/bin/selfloom.mjs help > /dev/null
          test -f /tmp/demo-out/timeline.md
          echo "自检通过：包内容完整、demo 可运行"

      - name: 发布
        run: npm publish --provenance
